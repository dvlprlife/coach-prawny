name: Feature request
description: Propose an enhancement.
title: "[Feature]: "
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Saying what problem the change solves — not
        just what to build — makes it much easier to judge and to design well.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be built or changed?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / context
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What would "done" look like?
      description: Optional, but helpful — the specific behaviour that would mean this is finished.
      placeholder: |
        - [ ] ...
        - [ ] Verified in a real browser
    validations:
      required: false
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope / notes
      description: Anything explicitly not part of this request — optional.
    validations:
      required: false
