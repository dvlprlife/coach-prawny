name: Feature request
description: Propose an enhancement. Filed issues enter the agent pipeline automatically.
title: "[Feature]: "
labels:
  - "agent"
  - "status: need plan"
body:
  - type: markdown
    attributes:
      value: |
        Issues filed with this form are labeled `agent` + `status: need plan`
        and are picked up by the automated planner. Clear acceptance criteria
        help the planner write an actionable plan.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be built or changed?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / context
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist items the change must satisfy — the worker treats these as the definition of done.
      placeholder: |
        - [ ] ...
        - [ ] `npm run build` passes
        - [ ] Verified in a real browser
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope / notes
      description: Anything explicitly not part of this request — optional.
    validations:
      required: false
