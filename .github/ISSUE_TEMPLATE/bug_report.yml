name: Bug report
description: Report something that isn't working.
title: "[Bug]: "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. The more precisely a bug is
        described, the faster it gets fixed — a FEN and the steps that trigger
        it are usually enough to reproduce anything in this app.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: fen
    attributes:
      label: FEN
      description: >-
        The position the bug happens on, copied from the FEN box. Most bugs here
        are position-specific — castling rights, en passant and side-to-move are
        the usual culprits — so this is the single most useful field.
      placeholder: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste the FEN above into the FEN box
        2. Switch to setup mode
        3. ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What would "fixed" look like?
      description: Optional, but helpful — the specific behaviour you'd expect once this is resolved.
      placeholder: |
        - [ ] ...
        - [ ] Verified in a real browser on the FEN above
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Environment / additional context
      description: Browser, OS, console output, screenshot — optional.
    validations:
      required: false
