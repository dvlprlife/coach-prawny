name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repo default is already read-only, but state it here so the job keeps the
# narrowest scope even if that default is widened later. Nothing in this
# workflow writes to the repo; dependency-review needs to read contents and,
# on a PR, the diff.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary dev platform; Linux is the deploy target
        # (Cloudflare Workers). macOS is omitted because it is neither — the
        # repo is public now, so Actions minutes are no longer the reason. Note
        # that adding a leg means updating the ruleset's required status checks
        # too: the contexts are matrix-derived strings ("build (ubuntu-latest)"),
        # so a new leg is not required-by-default and renaming one silently
        # drops the gate.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      # oxlint rather than ESLint: typescript-eslint hard-refuses to load
      # against TypeScript 7 (it throws on startup, so --force does not help),
      # and this repo is on TS 7. oxlint brings its own parser and has no
      # opinion about the TypeScript version. The rules that actually earn
      # their keep here are react-hooks/exhaustive-deps and rules-of-hooks —
      # the React layer has no test coverage at all, so this is the only
      # automated check that looks at it. Revisit ESLint if/when
      # typescript-eslint supports TS >=7.1 (their issue #10940).
      #
      # This is a step inside the existing matrix job, not a job of its own, so
      # the ruleset's required status checks stay as they are — they are
      # matrix-derived strings ("build (ubuntu-latest)"), and a new job would
      # not be required-by-default. It runs first because it takes
      # milliseconds; a lint failure should not wait on a full bundle.
      - name: Lint (oxlint)
        run: npm run lint
      # Unit tests over the pure modules (fen, material, moveQuality,
      # positionLink). Runs before the build so a logic regression fails fast
      # rather than after a full bundle.
      - name: Test (vitest)
        run: npm test
      # `npm run build` is `tsc && vite build`, so this is the typecheck gate
      # AND the bundle gate in one step.
      - name: Build (tsc + vite build)
        run: npm run build
      # The Stockfish worker is served from public/engine/ rather than bundled,
      # precisely so the .wasm sits next to its .js loader. public/engine/ is
      # gitignored and regenerated from node_modules by the `prebuild` hook
      # (scripts/sync-engine.mjs), so on a clean CI checkout these files exist
      # only if that hook ran and found what it expected. Nothing type-checks
      # any of it, so assert the pair survived into dist/.
      - name: Verify Stockfish engine assets shipped
        shell: bash
        run: |
          for f in dist/engine/stockfish-18-lite-single.js \
                   dist/engine/stockfish-18-lite-single.wasm; do
            if [ ! -s "$f" ]; then
              echo "missing or empty: $f"
              exit 1
            fi
            echo "ok: $f"
          done
      # public/_headers carries the COOP/COEP pair that lets the engine run
      # cross-origin-isolated on Cloudflare Pages. It is deploy config with no
      # compile-time reference anywhere, so it is the easiest file in the repo
      # to delete by accident.
      - name: Verify _headers shipped
        shell: bash
        run: |
          test -s dist/_headers
          echo "ok: dist/_headers"
      # about.html is generated from the About component after the bundle is
      # built (scripts/build-about.mjs). Nothing references it at compile time,
      # and an empty or unstyled page would still deploy and still return 200,
      # so assert it has content and picked up the hashed stylesheet.
      - name: Verify the About page was generated
        shell: bash
        run: |
          test -s dist/about.html
          grep -q 'rel="stylesheet"' dist/about.html
          grep -q '<h2>' dist/about.html
          echo "ok: dist/about.html"

  # Fails a PR that introduces a dependency with a known vulnerability, which
  # Dependabot alone only tells you about after the fact. Needs the dependency
  # graph, which is free on public repos only — this job would be a no-op error
  # if the repo ever went private again. PR-only: the action has no diff to
  # review on a push.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # Block only on genuinely serious advisories, so a low-severity
          # transitive finding doesn't wedge an unrelated PR.
          fail-on-severity: high
