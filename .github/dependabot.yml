# Dependabot keeps npm dependencies and GitHub Actions current via weekly,
# grouped PRs. These PRs are a human-reviewed stream OUTSIDE the agent label
# state machine — they carry only the `dependencies` label, never
# `agent` / `status:*`, so nothing picks them up as pipeline work. All
# Dependabot PRs run through the same build.yml CI as any other PR.
#
# The catch-all groups set `update-types: [minor, patch]` deliberately. A group
# with only `patterns: ["*"]` does NOT leave majors alone — it sweeps them in,
# so one PR arrives carrying several unrelated breaking changes at once. That is
# not hypothetical: the first weekly run here opened exactly two such PRs, one
# bundling vite 5→8 + typescript 5→7 + @vitejs/plugin-react 4→6, the other
# bundling react 18→19 + react-dom 18→19 + react-chessboard 4→5. Restricting
# the catch-alls keeps routine minor+patch noise batched while forcing each
# major into its own reviewable PR.
#
# The `react` and `vite` groups are the deliberate exceptions: they omit
# `update-types` so they carry majors too. Their members are coupled and must
# move in lockstep or the PR cannot pass CI on its own — @types/react 18 does
# not typecheck against react 19, and @vitejs/plugin-react's peer range on vite
# makes a lone major of either fail `npm ci` with ERESOLVE. The react family
# also spans both dependency-types, which the two catch-alls cannot express. A
# dependency lands in the group with the most specific matching pattern, so
# these exact names win over the catch-alls' `*`.
#
# `react-chessboard` is deliberately NOT in that group. Its major is a code
# migration, not a version bump (v5 drops the `position` prop and the deep types
# import), so it belongs in its own PR. Note the ordering constraint: v5 requires
# react ^19, so the react group has to land first.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      # Listed first for readability only — Dependabot resolves by pattern
      # specificity, not by order. No `update-types`, so majors group here too.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Same reasoning, peer-dependency flavour: @vitejs/plugin-react declares a
      # peer range on vite, so a major of either alone fails `npm ci` outright
      # with ERESOLVE — plugin-react 6 against vite 5, and plugin-react 4
      # against vite 8, both verified. typescript is deliberately not here; its
      # 5→7 major passes CI on its own.
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
